<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="streamGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing rounded glass shield -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#0C1120" stroke="url(#streamGrad)" stroke-width="2.5" />
  <rect x="10" y="10" width="44" height="44" rx="12" fill="url(#streamGrad)" fill-opacity="0.12" />
  <!-- Stream Arrow / Lightning bolt dynamic path -->
  <path d="M26 18L42 32L26 46V36H16V28H26V18Z" fill="url(#streamGrad)" filter="url(#glowFilter)" />
  <!-- Downloader Arrow Accent -->
  <path d="M42 22V42M42 42L36 36M42 42L48 36" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
